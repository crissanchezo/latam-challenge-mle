name: 'Continuous Delivery'

# TODO: Change it
on:
  push:
    branches:
      - feature/ci_cd

env:
  SERVICE: 'latam-api'
  REPO_NAME: 'latam-challenge'

jobs:
  job_id:
    runs-on: ubuntu-latest
    environment: latam_env

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: 'actions/checkout@v4'

    - name: GCP Authentication
      id: auth
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.SERVICE_ACCOUNT }}'
        token_format: 'access_token'

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-flags: --debug

    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE }}:${{ github.sha }}
          ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Cloud Run
      uses: 'google-github-actions/deploy-cloudrun@v3'
      with:
          service: ${{ env.SERVICE }}
          region: ${{ secrets.REGION }}
          image: "${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"
          flags: "--allow-unauthenticated"
