name: 'Continuous Delivery'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SERVICE: 'latam-flight-delay-api'
  REPO_NAME: 'latam-challenge'

jobs:
  job_id:

    environment: latam_env

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: 'actions/checkout@v4'

    - uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ secrets.SERVICE_ACCOUNT }}'
        token_format: 'access_token'

    - id: 'deploy'
      uses: 'google-github-actions/deploy-cloudrun@v3'
      with:
          service: ${{ env.SERVICE }}
          region: ${{ secrets.REGION }}
          image: "${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"

    - name: 'Use output'
      run: 'curl "${{ steps.deploy.outputs.url }}/health"'