[project]
name = "challenge-mle"
version = "0.2.0"
description = "MLE Challenge"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.23.0",
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "httpx>=0.24.0",
]

[dependency-groups]
dev = [
  "matplotlib>=3.8.0",
  "seaborn>=0.12.2",
  "ipykernel>=7.1.0",
  "jupyter>=1.1.1",
  "xgboost>=3.1.0",
]

test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "coverage>=7.4.0",
  "locust>=2.20.0",
  "mockito>=1.5.0",
  "anyio>=4.0.0",
]
